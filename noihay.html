<title>Nói Hay 회화</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E8EEEB; --ink:#14201C; --muted:#5B6B65; --line:#D6E0DB;
  --jade:#0B7A5F; --jade-ink:#FFFFFF; --jade-soft:#DDEFE8;
  --vn:#C8324F; --en:#2A55C9;
  --ok:#16825D; --ok-soft:#DDF2E8; --tone:#A86B12; --tone-soft:#FBEFD9; --miss:#C23B3B; --miss-soft:#FBE3E3;
  --font:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1513; --surface:#16201D; --sunk:#111A17; --ink:#E4ECE8; --muted:#93A39D; --line:#27352F;
    --jade:#3CC39C; --jade-ink:#06231A; --jade-soft:#173B31;
    --vn:#F06A86; --en:#86A4F7;
    --ok:#45C08D; --ok-soft:#153428; --tone:#E3A94B; --tone-soft:#3A2C12; --miss:#EF6B6B; --miss-soft:#3B1A1A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1513; --surface:#16201D; --sunk:#111A17; --ink:#E4ECE8; --muted:#93A39D; --line:#27352F;
  --jade:#3CC39C; --jade-ink:#06231A; --jade-soft:#173B31;
  --vn:#F06A86; --en:#86A4F7;
  --ok:#45C08D; --ok-soft:#153428; --tone:#E3A94B; --tone-soft:#3A2C12; --miss:#EF6B6B; --miss-soft:#3B1A1A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.brand h1 span{color:var(--jade)}
.brand small{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[data-lang="vi"][aria-pressed="true"]{color:var(--vn)}
.seg button[data-lang="en"][aria-pressed="true"]{color:var(--en)}
.seg button[data-lang="both"][aria-pressed="true"]{color:var(--jade)}

/* scenes */
.scenes{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}


.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:780px){.grid{grid-template-columns:minmax(0,1fr)}}

/* phrase list */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:0;background:transparent;padding:11px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sunk)}
.item[aria-current="true"]{background:var(--jade-soft)}
.item .t{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.item .k{font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);margin-top:6px}
.dot.tried{border-color:var(--tone)}
.dot.done{border-color:var(--ok);background:var(--ok)}

/* drill */
.drill{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ko{font-size:16px;color:var(--muted);margin:0}
.target{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0}
.syl{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.syl .w{font-size:32px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.syl .tn{font-size:11px;color:var(--muted);letter-spacing:.02em}
.lang-en .syl .w{font-size:30px}
.hint{font-size:14px;color:var(--muted);margin:0}
.enline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-left:3px solid var(--en);padding:2px 0 2px 12px}
.enline .e{font-size:24px;font-weight:600;color:var(--en);line-height:1.3}
.item .t2{display:block;font-size:14px;color:var(--en);overflow-wrap:anywhere}
.gw.en b{color:var(--en)}
.gtitle{margin:6px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint b{font-weight:500;color:var(--ink)}
.gloss{display:flex;flex-direction:column;gap:8px;margin:0}
.gloss h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.gwords{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.gw{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 10px}
.gw:hover{border-color:var(--jade)}
.gw b{font-size:15px;font-weight:600;color:var(--vn)}
.gw span{font-size:13px;color:var(--ink)}
.gw.unk span{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.say{display:flex;flex-direction:column;gap:8px}
.say label{font-size:13px;color:var(--muted)}
.say .in{display:flex;gap:8px}
.say input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:17px}
.tip{font-size:12.5px;color:var(--muted);margin:0}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}

/* result */
.result{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.score .msg{font-size:15px;font-weight:500}
.score .ex{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.wd{display:inline-flex;flex-direction:column;align-items:center;border-radius:8px;padding:4px 9px;font-size:18px;font-weight:500}
.wd small{font-size:11px;font-weight:400}
.wd.ok{background:var(--ok-soft);color:var(--ok)}
.wd.tone,.wd.vowel{background:var(--tone-soft);color:var(--tone)}
.wd.miss{background:var(--miss-soft);color:var(--miss);text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.coach{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap;margin:0}

/* tones */
.tones{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.tones h2{margin:0;font-size:15px}
.tones p{margin:0;font-size:13px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:560px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tcell{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent}
.tcell:hover{background:var(--sunk)}
.tcell .m{font-size:24px;font-weight:600}
.tcell .nm{font-size:12px;font-weight:500}
.tcell .ds{font-size:11px;color:var(--muted);text-align:center}
.tcell svg{width:44px;height:26px}
.tcell svg polyline{fill:none;stroke:var(--jade);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tcell svg line{stroke:var(--line);stroke-width:1}

/* chat */
.chat{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:780px){.chat{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.panel select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px}
.check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important}
.log{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:320px;max-height:62vh;overflow-y:auto}
.msg{max-width:88%;display:flex;flex-direction:column;gap:4px}
.msg.ai{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.bub{border-radius:14px;padding:10px 14px;font-size:16px}
.ai .bub{background:var(--sunk);border-top-left-radius:4px}
.me .bub{background:var(--jade);color:var(--jade-ink);border-top-right-radius:4px}
.bub .tr{display:block;font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-line}
.bub .spk{border:0;background:transparent;padding:0 0 0 6px;color:var(--jade);vertical-align:-2px}
.fix{background:var(--tone-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13.5px;max-width:100%}
.fix b{color:var(--tone);font-weight:600}
.empty{color:var(--muted);font-size:14px;margin:auto;text-align:center;max-width:36ch}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1px dashed var(--jade);background:transparent;border-radius:10px;padding:6px 10px;font-size:14px;text-align:left}
.sugg button small{display:block;color:var(--muted);font-size:12px}
.compose{display:flex;gap:8px}
.compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.note{font-size:13px;color:var(--muted);margin:0}
.warn{font-size:13px;color:var(--tone);margin:0}

/* stage bar + test */
.chip.locked{color:var(--muted);background:var(--sunk);border-style:dashed}
.chip .ck{color:var(--ok);font-weight:700}
.chip[aria-pressed="true"] .ck{color:inherit}
.stage{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px}
.stage p{margin:0;font-size:14px;color:var(--muted)}
.stage p b{color:var(--ink);font-weight:600}
.stage .pass{color:var(--ok);font-weight:600}
.flash{color:var(--tone);font-size:13px}
.test{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px;max-width:720px;width:100%;margin-inline:auto}
.tbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--jade)}
.q{font-size:22px;font-weight:600;margin:0;line-height:1.35}
.qk{font-size:13px;color:var(--muted);margin:0;letter-spacing:.04em}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--jade)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--miss-soft);border-color:var(--miss);color:var(--miss);text-decoration:line-through}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.review{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.review li{background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px}
.review li small{display:block;color:var(--muted)}

/* 글자 크기 (아이패드 = 기본 '크게') */
.seg.size button{padding:6px 11px;line-height:1}
.seg.size button[data-size="m"]{font-size:13px}
.seg.size button[data-size="l"]{font-size:16px}
.seg.size button[data-size="xl"]{font-size:19px}
html{-webkit-text-size-adjust:100%}
button,.chip,.item,.gw,.tcell,.opt{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html[data-size="l"] .wrap{zoom:1.25;max-width:1060px}
html[data-size="xl"] .wrap{zoom:1.45;max-width:940px}
html[data-size="l"] .log{max-height:48vh}
html[data-size="xl"] .log{max-height:40vh}
@media (max-width:1100px){
  html[data-size="l"] .grid,html[data-size="l"] .chat{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1300px){
  html[data-size="xl"] .grid,html[data-size="xl"] .chat{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  html[data-size="l"] .tgrid,html[data-size="xl"] .tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* 한 줄로 쌓였을 때 표현 목록은 가로 스크롤 대신 높이 제한 */
@media (max-width:1300px){
  html[data-size="l"] .list,html[data-size="xl"] .list{max-height:34vh;overflow-y:auto}
}
</style>
<script>
(function(){
  var s=null;
  try{ s=localStorage.getItem("noihay.size"); }catch(e){}
  if(!s){ s=(window.matchMedia&&matchMedia("(pointer:coarse) and (min-width:700px)").matches)?"l":"m"; }
  document.documentElement.setAttribute("data-size",s);
})();
</script>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Nói <span>Hay</span></h1>
      <small>베트남어 · 영어 생활 회화 (함께 공부 가능)</small>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="학습 언어">
        <button id="lang-vi" data-lang="vi" aria-pressed="true">Tiếng Việt</button>
        <button id="lang-en" data-lang="en" aria-pressed="false">English</button>
        <button id="lang-both" data-lang="both" aria-pressed="false" title="베트남어와 영어를 함께 공부">VI + EN</button>
      </div>
      <div class="seg" role="group" aria-label="모드">
        <button id="tab-drill" data-tab="drill" aria-pressed="true">표현 연습</button>
        <button id="tab-chat" data-tab="chat" aria-pressed="false">AI 회화</button>
      </div>
      <div class="seg size" role="group" aria-label="글자 크기">
        <button id="size-m" data-size="m" aria-pressed="false" aria-label="글자 보통">가</button>
        <button id="size-l" data-size="l" aria-pressed="false" aria-label="글자 크게">가</button>
        <button id="size-xl" data-size="xl" aria-pressed="false" aria-label="글자 아주 크게">가</button>
      </div>
    </div>
  </header>

  <!-- DRILL -->
  <section id="view-drill" style="display:flex;flex-direction:column;gap:16px">
    <div class="scenes" id="scenes"></div>
    <div class="stage" id="stage">
      <p id="stage-txt"></p>
      <div class="row"><span class="flash" id="stage-flash" hidden></span><button class="btn primary" id="b-test">이 단계 시험 보기</button></div>
    </div>
    <div class="test" id="test" hidden></div>
    <div class="grid" id="grid">
      <nav class="list" id="list" aria-label="표현 목록"></nav>
      <div style="display:flex;flex-direction:column;gap:16px">
        <article class="drill" id="drill">
          <div class="eyebrow"><span id="d-pos"></span><span id="d-voice"></span></div>
          <p class="ko" id="d-ko"></p>
          <p class="target" id="d-target"></p>
          <p class="hint" id="d-hint"></p>
          <div class="enline" id="d-en" hidden><span class="e" id="d-en-t"></span><button class="btn" id="b-en" type="button">🔊 English</button></div>
          <div class="gloss" id="d-gloss"><h3>단어 풀이 · 누르면 발음</h3><div class="gwords" id="d-gwords"></div></div>
          <div class="row">
            <button class="btn primary" id="b-play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>듣기</button>
            <button class="btn" id="b-slow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>천천히</button>
            <button class="btn" id="b-vi" type="button" hidden>🔊 Tiếng Việt</button>
            <button class="btn" id="b-prev" aria-label="이전 표현">‹ 이전</button>
            <button class="btn" id="b-next" aria-label="다음 표현">다음 ›</button>
          </div>
        </article>

        <aside class="tones" id="tones">
          <h2>여섯 성조 (북부 표준)</h2>
          <p>같은 'ma'도 음높이에 따라 뜻이 달라집니다. 칸을 누르면 들어볼 수 있어요.</p>
          <div class="tgrid" id="tgrid"></div>
        </aside>
      </div>
    </div>
  </section>

  <!-- CHAT -->
  <section id="view-chat" hidden>
    <div class="chat">
      <div class="panel">
        <label for="c-scene">상황<select id="c-scene"></select></label>
        <label for="c-level">수준<select id="c-level"><option value="beginner">초급 — 짧고 쉬운 문장</option><option value="intermediate">중급 — 자연스러운 속도</option></select></label>
        <label class="check"><input type="checkbox" id="c-auto" checked> 답변 자동으로 읽어주기</label>
        <button class="btn primary" id="c-start">새 대화 시작</button>
        <p class="note">Claude가 상대역을 맡고, 내 문장이 어색하면 고쳐 줍니다. 대화마다 내 Claude 사용량이 쓰입니다.</p>
        <p class="warn" id="c-unavail" hidden>이 화면에서는 Claude를 부를 수 없습니다. claude.ai에 로그인한 상태로 열면 AI 회화가 켜집니다.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <div class="log" id="c-log" aria-live="polite"><p class="empty" id="c-empty">상황을 고르고 <b>새 대화 시작</b>을 누르면 Claude가 먼저 말을 겁니다.</p></div>
        <div class="sugg" id="c-sugg"></div>
        <form class="compose" id="c-form">

function glossWords(sentence, lang="vi"){
  const w = tokens(sentence), out = [], dict = lang==="vi" ? GLOSS : GLOSS_EN, maxN = lang==="vi" ? 3 : 5;
  for(let i=0;i<w.length;){
    let hit = null;
    for(let n=maxN;n>=1 && !hit;n--){ const k = w.slice(i,i+n).join(" "); if(i+n<=w.length && dict[k]) hit = [k,n]; }
    if(hit){
      out.push([hit[0], dict[hit[0]]]); i += hit[1];
    } else if(lang==="en"){ i++;
    } else if(w[i]==="không"){
      out.push(["không", i===w.length-1 ? "문장 끝: ~인가요? (의문)" : "아니다, ~하지 않다"]); i++;
    } else { out.push([w[i], ""]); i++; }
  }
  return out;
}

const VI_CH = /[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
/* 채팅에서 읽어 줄 언어: 함께 모드에서는 글자를 보고 추정 */
const guessLang = t => S.lang!=="both" ? S.lang : VI_CH.test(t) ? "vi" : /\b(the|is|are|am|i|you|we|a|an|to|and|can|please|how|what|where|my|it|of|in|on|for|have|do|this|that|yes|no|hello|thanks)\b/i.test(t) ? "en" : "vi";

/* ---------- text analysis ---------- */
function tokens(s){
  return s.normalize("NFC").toLowerCase().replace(/[’‘]/g,"'").replace(/\(.*?\)/g," ")
    .replace(/[.,!?;:"“”…¿¡\-–—\/]/g," ").split(/\s+/).map(w=>w.replace(/^'+|'+$/g,"")).filter(Boolean);
}
function toneOf(w){ for(const ch of w.normalize("NFD")) if(TONE_MARK[ch]) return TONE_MARK[ch]; return "ngang"; }

/* ---------- speech ---------- */
const TTS = { voices:[], ok: "speechSynthesis" in window };
function loadVoices(){ if(!TTS.ok) return; TTS.voices = speechSynthesis.getVoices(); renderVoice(); }
if(TTS.ok){ loadVoices(); speechSynthesis.addEventListener?.("voiceschanged", loadVoices); }
function pickVoice(lang){
  const vs = TTS.voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith(lang));
  if(lang==="en"){ return vs.find(v=>/en-US/i.test(v.lang) && /natural|online|google/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang)) || vs[0]; }
  return vs.find(v=>/natural|online|google/i.test(v.name)) || vs[0];
}
let ttsTimer = 0;
let seqTok = 0;
function speak(text, lang, rate=1, then){
  seqTok++;
  if(!TTS.ok) return;
  if(!TTS.voices.length) TTS.voices = speechSynthesis.getVoices();
  clearTimeout(ttsTimer);
  if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,""));
  const v = pickVoice(lang); if(v) u.voice = v;
  u.lang = lang==="vi" ? "vi-VN" : "en-US"; u.rate = rate;
  if(then) u.onend = then;
  u.onerror = e => { if(e.error && e.error!=="canceled" && e.error!=="interrupted") flash("소리가 안 나요: "+e.error+(v?"":" (이 기기에 "+(lang==="vi"?"베트남어":"영어")+" 음성이 없어요)")); };
  // 취소 직후 바로 재생하면 일부 브라우저(크롬·안드로이드)가 소리를 삼킴 → 잠깐 뒤 재생
  ttsTimer = setTimeout(()=>{ speechSynthesis.resume(); speechSynthesis.speak(u); }, 80);
  if(!v && TTS.voices.length) flash((lang==="vi"?"베트남어":"영어")+" 음성이 이 기기에 없어요. 기기 설정 > 음성 출력에서 설치하세요.");
}
function speakSeq(list, rate=1){
  let tok; const [a,...rest] = list;
  speak(a[0], a[1], rate, rest.length ? ()=>{ if(tok===seqTok) speakSeq(rest, rate); } : undefined);
  tok = seqTok;
}
function renderVoice(){
  if(both()){
    const nm = v => v ? v.name.replace(/^Microsoft\s+/,"").replace(/\s*-.*$/,"") : "없음";
    $("d-voice").textContent = !TTS.ok ? "음성 재생 불가" : TTS.voices.length ? "음성 · 베트남어 "+nm(pickVoice("vi"))+" / 영어 "+nm(pickVoice("en")) : "";
    return;
  }
  const v = pickVoice(S.lang);
  $("d-voice").textContent = !TTS.ok ? "음성 재생 불가" : v ? "음성 · " + v.name.replace(/^Microsoft\s+/,"").replace(/\s*-.*$/,"") : (TTS.voices.length ? (S.lang==="vi"?"베트남어 음성 없음":"영어 음성 없음") : "");
}

function renderDrill(){ renderScenes(); renderStage(); renderList(); renderCard(); }
function move(d){
  let si=S.scene, i=S.idx+d;
  if(i<0){ if(si===0) return; si--; i=SCENES[si].items.length-1; }
  if(i>=SCENES[si].items.length){
    if(!passed(si) || si+1>=SCENES.length){ startTest(); return; }
    si++; i=0;
  }
  S.scene=si; S.idx=i; save(); renderDrill();
}

/* ---------- stage test ---------- */
const T = { qs:[], n:0, right:0, wrong:[], answered:false };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function pickOthers(pool, answer, k=3){ return shuffle([...new Set(pool.filter(x=>x!==answer))]).slice(0,k); }
function buildTest(si){
  const items = SCENES[si].items, kos = items.map(it=>it[0]);
  const langs = both() ? ["vi","en"] : [S.lang];
  const tg = {vi:items.map(it=>it[1]), en:items.map(it=>it[3])};
  const all = {vi:SCENES.flatMap(s=>s.items.map(it=>it[1])), en:SCENES.flatMap(s=>s.items.map(it=>it[3]))};
  const qs = [];
  const kinds = shuffle(["meaning","sentence","listen","meaning","sentence","listen"]);
  const idxs = shuffle(items.map((_,i)=>i));
  idxs.forEach((i,n)=>{
    const kind = kinds[n % kinds.length], l = langs[n % langs.length], targets = tg[l];
    if(kind==="meaning") qs.push({kind, label:"뜻 고르기"+(both()?" · "+LANGLABEL[l]:""), prompt:targets[i], sl:l, speakText:targets[i], answer:kos[i], opts:shuffle([kos[i], ...pickOthers(kos, kos[i])])});
    else if(kind==="sentence") qs.push({kind, label:"알맞은 문장 고르기"+(both()?" · "+LANGLABEL[l]:""), prompt:kos[i], al:l, answer:targets[i], opts:shuffle([targets[i], ...pickOthers(targets.length>=4?targets:all[l], targets[i])])});
    else qs.push({kind, label:"듣고 고르기"+(both()?" · "+LANGLABEL[l]:""), prompt:"🔊 들리는 문장을 고르세요", sl:l, al:l, speakText:targets[i], answer:targets[i], opts:shuffle([targets[i], ...pickOthers(targets, targets[i])])});
  });
  /* 함께 모드: 베트남어 ↔ 영어 짝 맞추기 두 문제 */
  if(both()) shuffle(idxs).slice(0,2).forEach((i,k)=>{
    const [a,b] = k%2 ? ["en","vi"] : ["vi","en"], pool = tg[b].length>=4 ? tg[b] : all[b];
    qs.push({kind:"translate", label:LANGLABEL[a]+" → "+LANGLABEL[b]+" 짝 찾기", prompt:tg[a][i], sl:a, speakText:tg[a][i], al:b, answer:tg[b][i], opts:shuffle([tg[b][i], ...pickOthers(pool, tg[b][i])])});
  });
  /* 단어·표현 풀이 문제 */
  langs.forEach(l=>{
    const dict = new Map();
    tg[l].forEach(t=>glossWords(t, l).forEach(([w,m])=>{ if(m) dict.set(w,m); }));
    const means = [...new Set(dict.values())];
    shuffle([...dict.keys()]).slice(0, both()?1:2).forEach(w=>{
      const m = dict.get(w);
      qs.push({kind:"word", label:"단어·표현 뜻"+(both()?" · "+LANGLABEL[l]:""), prompt:w, sl:l, speakText:w, answer:m, opts:shuffle([m, ...pickOthers(means, m)])});
    });
  });
  return shuffle(qs);
}
function startTest(){
  T.qs = buildTest(S.scene); T.n = 0; T.right = 0; T.wrong = [];
  $("grid").hidden = true; $("stage").hidden = true; $("test").hidden = false;
  renderQ();
  $("test").scrollIntoView({block:"start", behavior:"smooth"});
}
function closeTest(){ $("test").hidden = true; $("grid").hidden = false; $("stage").hidden = false; }
function renderQ(){
  const q = T.qs[T.n], box = $("test"); T.answered = false;
  const say = q.speakText ? el("button",{class:"btn", type:"button", onclick:()=>speak(q.speakText, q.sl, q.kind==="listen"?.9:.85)}, "🔊 듣기") : null;
  const next = el("button",{class:"btn primary", id:"t-next", type:"button", onclick:()=>{ T.n++; T.n<T.qs.length ? renderQ() : renderResult(); }}, T.n+1<T.qs.length ? "다음 문제 ›" : "결과 보기 ›");
  next.hidden = true;
  const opts = el("div",{class:"opts"});
  q.opts.forEach(o=>{
    opts.append(el("button",{class:"opt", type:"button", onclick:(e)=>{
      if(T.answered) return; T.answered = true;
      const ok = o===q.answer; if(ok) T.right++; else T.wrong.push(q);
      [...opts.children].forEach(b=>{ b.disabled = true; if(b.textContent===q.answer) b.classList.add("right"); });
      if(!ok) e.currentTarget.classList.add("wrong");
      if(q.al) speak(q.answer, q.al, .9);
      next.hidden = false; next.focus();
    }}, o));
  });
  box.replaceChildren(
    el("div",{class:"eyebrow"}, el("span",{}, (S.scene+1)+"단계 시험 · "+SCENES[S.scene].ko), el("span",{}, (T.n+1)+" / "+T.qs.length)),
    el("div",{class:"tbar"}, el("i",{style:"width:"+(T.n/T.qs.length*100)+"%"})),
    el("p",{class:"qk"}, q.label),
    q.kind==="listen" ? el("div",{class:"row"}, say) : el("p",{class:"q"}, q.prompt),
    q.kind!=="listen" && say ? el("div",{class:"row"}, say) : null,
    opts,
    el("div",{class:"row"}, next, el("button",{class:"btn", type:"button", onclick:()=>{ closeTest(); renderDrill(); }}, "그만두기"))
  );
  if(q.kind==="listen") speak(q.speakText, q.sl, .9);
}
function renderResult(){
  const score = Math.round(T.right / T.qs.length * 100), si = S.scene, ok = score >= PASS;
  const was = bestOf(si);
  S.cleared[S.lang][SCENES[si].id] = Math.max(was, score); save();
  const hasNext = si+1 < SCENES.length;
  const box = $("test");
  const review = T.wrong.length ? el("ul",{class:"review"}, ...T.wrong.map(q=>el("li",{}, q.kind==="listen" ? "듣기 문제" : q.prompt, el("small",{}, "정답: "+q.answer)))) : null;
  box.replaceChildren(
    el("div",{class:"eyebrow"}, el("span",{}, (si+1)+"단계 시험 결과 · "+SCENES[si].ko), el("span",{}, "통과 기준 "+PASS+"점")),
    el("div",{class:"row"}, el("span",{class:"big", style:"color:var(--"+(ok?"ok":"miss")+")"}, String(score)), el("span",{style:"font-size:16px;font-weight:600"},
      ok ? (hasNext ? "통과! "+(si+2)+"단계 '"+SCENES[si+1].ko+"'가 열렸어요." : "통과! 모든 단계를 마쳤어요.") : "아쉬워요. "+PASS+"점 이상이면 통과예요.")),
    el("p",{class:"note"}, T.qs.length+"문제 중 "+T.right+"개 정답"),
    review ? el("p",{class:"qk"}, "틀린 문제") : null, review,
    el("div",{class:"row"},
      ok && hasNext ? el("button",{class:"btn primary", type:"button", onclick:()=>{ S.scene=si+1; S.idx=0; save(); closeTest(); renderDrill(); }}, "다음 단계로 ›") : null,
      el("button",{class:"btn"+(ok?"":" primary"), type:"button", onclick:startTest}, "다시 시험 보기"),
      el("button",{class:"btn", type:"button", onclick:()=>{ S.idx=0; save(); closeTest(); renderDrill(); }}, ok ? "이 단계 복습하기" : "다시 공부하기"))
  );
}

/* ---------- Claude ---------- */
const AI = { sample:null, ctl:null, turns:[], rules:"" };
(async ()=>{
  try{ AI.sample = window.claude ? await window.claude.use("sample") : null; }catch(e){ AI.sample = null; }
  $("c-unavail").hidden = !!AI.sample;
  $("c-start").disabled = !AI.sample; $("c-send").disabled = !AI.sample;
})();
function errText(e){
  const c = e && e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"){ AI.sample=null; $("c-unavail").hidden=false; return "Claude 사용이 허용되지 않았습니다."; }
  if(c==="rate_limited") return "요청이 많습니다. 잠시 뒤 다시 눌러 주세요.";
  if(c==="session_expired") return "claude.ai에 다시 로그인해 주세요.";
  if(c==="invalid_json") return "답변 형식이 어긋났습니다. 한 번 더 보내 주세요.";
  return "연결이 끊겼습니다. 다시 시도해 주세요.";
}

/* chat */
function chatRules(){
  const si = +$("c-scene").value, bo = both(), lang = bo ? "Vietnamese" : LANGNAME[S.lang];
  const sc = SCENES[si] || null;
  const rl = S.lang==="en" ? "en" : "vi";
  const role = sc ? sc.role[rl] : (rl==="vi" ? "a friendly Vietnamese friend" : "a friendly friend");
  const level = $("c-level").value==="beginner" ? "beginner: use very short, simple, high-frequency sentences (under 10 words)" : "intermediate: natural everyday speech, up to 2 sentences";
  return `You are a conversation partner helping a Korean speaker practice everyday spoken ${lang}. Stay in character as ${role}${sc?" (situation: "+sc.ko+")":""}. Level — ${level}.
${S.lang!=="en"?"Use standard Vietnamese with full diacritics. ":""}${bo?"The learner studies Vietnamese and English together: always speak Vietnamese, and add an English translation of every line. The learner may answer in Vietnamese or English; correct whichever language they used and write fix.better in that same language. ":""}Reply as a native speaker would actually talk in daily life. Ask something back so the conversation continues.
The learner types or dictates via speech recognition, so ignore capitalization and punctuation. ${S.lang!=="en"?"Missing or wrong tone marks usually mean a pronunciation mistake — point them out in fix.":"Point out wrong words or unnatural phrasing in fix."} If the learner writes in Korean, treat it as "how do I say this" and put the ${lang} version in fix.better.
Every reply must be ONLY this JSON object:
{"reply":"your line in ${lang}","ko":"Korean translation of reply",${bo?`"en":"English translation of reply",`:""}"fix":null or {"better":"a correct, natural version of the learner's last message in ${lang}","note":"one short Korean explanation"},"next":[{"t":"a short line the learner could say next in ${lang}","ko":"Korean meaning"${bo?`,"en":"English meaning"`:""}},{"t":"..."}]}
Set fix to null when the learner's last message was already natural and correct. When the learner says START, open the conversation yourself with fix null.`;
}
function spkBtn(text){ return el("button",{class:"spk","aria-label":"읽어주기", onclick:()=>speak(text,guessLang(text))}, "🔊"); }
function addMsg(who, text, tr){
  $("c-empty")?.remove();
  const bub = el("div",{class:"bub"}, text, who==="ai"? spkBtn(text):null, tr? el("span",{class:"tr"}, tr):null);
  const m = el("div",{class:"msg "+who}, bub);
  $("c-log").append(m); $("c-log").scrollTop = $("c-log").scrollHeight;
  return m;
}
function renderSugg(list){
  const box = $("c-sugg"); box.replaceChildren();
  (Array.isArray(list)?list:[]).slice(0,3).forEach(s=>{
    if(!s || !s.t) return;
    box.append(el("button",{type:"button", onclick:()=>{ $("c-in").value = s.t; $("c-in").focus(); speak(s.t,guessLang(s.t)); }}, String(s.t), el("small",{}, [s.en, s.ko].filter(Boolean).join(" · "))));
  });
}
async function ask(userText){
  if(!AI.sample) return;
  const lastMe = userText!=="START" ? addMsg("me", userText) : null;
  AI.turns.push({role:"user", content:userText});
  const turns = [{role:"user", content:AI.rules}, ...AI.turns.slice(-24)];
  const wait = addMsg("ai","…");
  AI.ctl = new AbortController();
  $("c-send").disabled = true; $("c-stop").hidden = false; renderSugg([]);
  try{
    const r = await AI.sample.json(turns, {modelTier:"quick", cache:false, signal:AI.ctl.signal});
    wait.remove();
    const reply = String(r && r.reply || "");
    addMsg("ai", reply, [r && r.en, r && r.ko].filter(Boolean).map(String).join("\n"));
    AI.turns.push({role:"assistant", content:JSON.stringify(r)});
    if(lastMe && r && r.fix && r.fix.better){
      lastMe.append(el("div",{class:"fix"}, el("b",{},"더 자연스럽게 "), String(r.fix.better), " ", spkBtn(String(r.fix.better)), r.fix.note? el("div",{}, String(r.fix.note)):null));
    }
    renderSugg(r && r.next);
    if($("c-auto").checked && reply) speak(reply, both() ? "vi" : S.lang);
  }catch(e){
    wait.remove();
    AI.turns.pop();
    if(!e || e.code!=="cancelled") addMsg("ai", errText(e));
    if(lastMe) lastMe.remove();
    if(userText!=="START") $("c-in").value = userText;
  }finally{
    $("c-send").disabled = !AI.sample; $("c-stop").hidden = true;
    $("c-log").scrollTop = $("c-log").scrollHeight;
  }
}
function startChat(){
  AI.ctl?.abort();
  AI.turns = []; AI.rules = chatRules();
  $("c-log").replaceChildren(); renderSugg([]);
  ask("START");
}

/* ---------- wiring ---------- */
function setLang(l){
  S.lang = l;
  if(!unlocked(S.scene)){ S.scene = lastOpen(); S.idx = 0; }
  save(); closeTest();
  $("lang-vi").setAttribute("aria-pressed", String(l==="vi"));
  $("lang-en").setAttribute("aria-pressed", String(l==="en"));
  $("lang-both").setAttribute("aria-pressed", String(l==="both"));
  renderDrill();
  $("c-in").lang = l==="en" ? "en" : "vi";
  $("c-log").replaceChildren(el("p",{class:"empty",id:"c-empty"}, "언어를 바꿨습니다. ", el("b",{},"새 대화 시작"), "을 눌러 주세요."));
  AI.turns = []; renderSugg([]);
}
function setTab(t){
  S.tab = t;
  $("tab-drill").setAttribute("aria-pressed", String(t==="drill"));
  $("tab-chat").setAttribute("aria-pressed", String(t==="chat"));
  $("view-drill").hidden = t!=="drill"; $("view-chat").hidden = t!=="chat";
}
$("lang-vi").onclick = ()=>setLang("vi");
$("lang-en").onclick = ()=>setLang("en");
$("lang-both").onclick = ()=>setLang("both");
$("tab-drill").onclick = ()=>setTab("drill");
$("tab-chat").onclick = ()=>setTab("chat");
const playCur = rate => both() ? speakSeq([[cur()[1],"vi"],[cur()[3],"en"]], rate) : speak(textOf(cur()), S.lang, rate);
$("b-play").onclick = ()=>playCur(1);
$("b-slow").onclick = ()=>playCur(.6);
$("b-prev").onclick = ()=>move(-1);
$("b-next").onclick = ()=>move(1);
$("b-test").onclick = startTest;
$("c-start").onclick = startChat;
$("c-stop").onclick = ()=>AI.ctl?.abort();
$("c-form").addEventListener("submit", e=>{
  e.preventDefault();
  const v = $("c-in").value.trim(); if(!v || !AI.sample) return;
  if(!AI.rules){ AI.rules = chatRules(); $("c-log").replaceChildren(); }
  $("c-in").value = ""; ask(v);
});
(function(){
  const s = $("c-scene");
  SCENES.forEach((sc,i)=>s.append(el("option",{value:String(i)}, sc.ko)));
  s.append(el("option",{value:"-1"}, "자유 대화"));
})();
setLang(S.lang);
</script>
